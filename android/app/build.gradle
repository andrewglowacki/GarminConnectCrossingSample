plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ciqrepro.crossing'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ciqrepro.crossing'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation('com.garmin.connectiq:ciq-companion-app-sdk:2.2.0') { artifact { type = 'aar' } }
}
